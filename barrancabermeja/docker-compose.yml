# Variables requeridas en .env (junto a este archivo):
#   DB_PASS, DB_ROOT_PASSWORD
# Opcionales: APP_PORT (8080), DB_NAME (libroqr), DB_USER (app)
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_NAME: ${DB_NAME:-libroqr}
      DB_USER: ${DB_USER:-app}
      DB_PASS: ${DB_PASS:?Define DB_PASS en el archivo .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-libroqr}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASS:?Define DB_PASS en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/mysql
      # Crea las tablas la primera vez que se inicializa el volumen
      - ./includes/CRUD:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
